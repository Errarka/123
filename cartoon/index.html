<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Котик и шарик</title>
<style>
  :root { --bg: #111; --fg: #fff; --accent: #ff5a5f; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; box-sizing: border-box; }
  .stage { position: relative; width: 100%; max-width: 960px; aspect-ratio: 16 / 9; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 12px; background: #000; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.45); border-radius: 12px; }
  .overlay[hidden] { display: none; }
  button { font: inherit; border: 0; border-radius: 999px; cursor: pointer; }
  .big { font-size: 22px; padding: 14px 28px; background: var(--accent); color: #fff; }
  .bar { width: 100%; max-width: 960px; display: flex; align-items: center; gap: 10px; }
  .bar button { background: #2a2a2a; color: #fff; padding: 8px 14px; }
  .progress { flex: 1; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
  .progress div { height: 100%; width: 0; background: var(--accent); }
  .time { font-variant-numeric: tabular-nums; min-width: 84px; text-align: right; opacity: .8; }
</style>
</head>
<body>
<div class="stage">
  <canvas id="c" width="960" height="540"></canvas>
  <div class="overlay" id="overlay"><button class="big" id="start">▶ Смотреть мультик</button></div>
</div>
<div class="bar">
  <button id="pause">⏸</button>
  <button id="sound">🔊</button>
  <div class="progress"><div id="prog"></div></div>
  <span class="time" id="time">0:00 / 1:00</span>
</div>
<script>
const W = 960, H = 540, DURATION = 60, GROUND = 440;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- helpers ----------
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const ease = k => k * k * (3 - 2 * k);
const fade = (t, a, b, f = 0.6) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));

function rand(seed) { // deterministic pseudo-random
  let s = seed;
  return () => (s = (s * 16807) % 2147483647) / 2147483647;
}

function hex(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
function gradientAt(keys, t) {
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, c0] = keys[i], [t1, c1] = keys[i + 1];
    if (t <= t1) {
      const k = ease(seg(t, t0, t1)), a = hex(c0), b = hex(c1);
      return `rgb(${a.map((v, j) => Math.round(lerp(v, b[j], k))).join(',')})`;
    }
  }
  return keys[keys.length - 1][1];
}

// ---------- scene data ----------
const skyTop = [[0,'#120c33'],[6,'#ff8a65'],[12,'#4aa8e8'],[40,'#4aa8e8'],[47,'#ff6f61'],[53,'#070a24'],[60,'#070a24']];
const skyBot = [[0,'#3b2a6b'],[6,'#ffd59e'],[12,'#bfe7ff'],[40,'#bfe7ff'],[47,'#ffc27a'],[53,'#1c1f4a'],[60,'#1c1f4a']];

const r = rand(42);
const stars = Array.from({ length: 140 }, () => ({ x: r() * W, y: r() * H * 0.85, s: r() * 1.8 + 0.4, p: r() * 6 }));
const clouds = Array.from({ length: 14 }, (_, i) => ({ x: r() * W, y: 160 - i * 75 - r() * 40, s: 0.6 + r() * 0.8, v: 6 + r() * 14 }));
const flowers = Array.from({ length: 26 }, () => ({ x: r() * W, y: GROUND + 10 + r() * 80, c: ['#ff6b9a','#ffd23f','#ffffff','#b388ff'][Math.floor(r() * 4)], s: 0.7 + r() * 0.6 }));
const houses = Array.from({ length: 9 }, (_, i) => ({ x: 30 + i * 110 + r() * 20, w: 60 + r() * 30, h: 50 + r() * 50, c: ['#e07a5f','#f2cc8f','#81b29a','#3d405b'][i % 4] }));

const subtitles = [
  [8, 15, 'Жил-был рыжий котик Мурзик.'],
  [15, 20.5, 'Каждое утро он гулял по полянке.'],
  [20.5, 26, 'Однажды к нему прилетел красный шарик…'],
  [26, 30, 'Мурзик подпрыгнул — и поймал его!'],
  [30, 38, 'Шарик понёс котика высоко-высоко!'],
  [38, 46, 'Выше облаков и птиц…'],
  [46, 53, 'Наступил вечер, зажглись звёзды.'],
  [53, 58, 'А Мурзик долетел до самой Луны!'],
];

// ---------- drawing primitives ----------
function circle(x, y, rad, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill(); }
function ellipse(x, y, rx, ry, color, rot = 0) { ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); }

function drawSky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, gradientAt(skyTop, t));
  g.addColorStop(1, gradientAt(skyBot, t));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const a = Math.max(1 - seg(t, 5, 10), seg(t, 46, 53));
  if (a > 0) for (const s of stars) {
    ctx.globalAlpha = a * (0.6 + 0.4 * Math.sin(t * 3 + s.p));
    circle(s.x, s.y, s.s, '#fff');
  }
  ctx.globalAlpha = 1;
}

function drawSun(t, camY) {
  const rise = ease(seg(t, 0, 10)), set = ease(seg(t, 40, 50));
  const y = lerp(520, 110, rise) + set * 500 + camY * 0.15;
  const x = lerp(160, 260, rise) + set * 120;
  const glow = ctx.createRadialGradient(x, y, 20, x, y, 140);
  glow.addColorStop(0, 'rgba(255,230,120,.8)'); glow.addColorStop(1, 'rgba(255,230,120,0)');
  ctx.fillStyle = glow; ctx.fillRect(x - 140, y - 140, 280, 280);
  circle(x, y, 48, '#ffe066');
}

function drawMoon(t, x, y) {
  const a = seg(t, 45, 50);
  if (!a) return;
  ctx.globalAlpha = a;
  const glow = ctx.createRadialGradient(x, y, 40, x, y, 200);
  glow.addColorStop(0, 'rgba(255,255,220,.35)'); glow.addColorStop(1, 'rgba(255,255,220,0)');
  ctx.fillStyle = glow; ctx.fillRect(x - 200, y - 200, 400, 400);
  circle(x, y, 90, '#f6f1d1');
  circle(x - 30, y - 20, 14, '#e2dbb4'); circle(x + 25, y + 25, 20, '#e2dbb4'); circle(x + 35, y - 35, 9, '#e2dbb4');
  ctx.globalAlpha = 1;
}

function drawCloud(x, y, s) {
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.beginPath();
  for (const [dx, dy, rr] of [[0,0,30],[30,-15,36],[65,0,30],[32,10,30]]) {
    ctx.moveTo(x + dx * s + rr * s, y + dy * s);
    ctx.arc(x + dx * s, y + dy * s, rr * s, 0, Math.PI * 2);
  }
  ctx.fill();
}

function drawClouds(t, camY) {
  const night = seg(t, 46, 53);
  ctx.globalAlpha = 1 - night * 0.7;
  for (const c of clouds) {
    const x = ((c.x + t * c.v) % (W + 200)) - 100;
    const y = c.y + camY * 0.9;
    if (y > -80 && y < H + 80) drawCloud(x, y, c.s);
  }
  ctx.globalAlpha = 1;
}

function drawLand(t, camY) {
  const dark = seg(t, 44, 53) * 0.6;
  // far hills
  ctx.fillStyle = '#6fbf73';
  ctx.beginPath(); ctx.moveTo(0, H + camY);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, GROUND - 70 + Math.sin(x / 140) * 30 + camY * 0.8);
  ctx.lineTo(W, H + camY + 400); ctx.lineTo(0, H + camY + 400); ctx.fill();
  // houses on the hills
  for (const h of houses) {
    const by = GROUND - 40 + Math.sin(h.x / 140) * 30 + camY * 0.8;
    ctx.fillStyle = h.c; ctx.fillRect(h.x, by - h.h, h.w, h.h);
    ctx.fillStyle = '#8d3b2f';
    ctx.beginPath(); ctx.moveTo(h.x - 6, by - h.h); ctx.lineTo(h.x + h.w / 2, by - h.h - 30); ctx.lineTo(h.x + h.w + 6, by - h.h); ctx.fill();
    ctx.fillStyle = t > 47 ? '#ffe680' : '#cfe8ff';
    ctx.fillRect(h.x + h.w / 2 - 9, by - h.h + 14, 18, 16);
  }
  // near meadow
  ctx.fillStyle = '#4caf50';
  ctx.beginPath(); ctx.moveTo(0, H + camY + 400);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, GROUND + Math.sin(x / 90 + 1) * 6 + camY);
  ctx.lineTo(W, H + camY + 400); ctx.fill();
  for (const f of flowers) {
    const y = f.y + camY, sway = Math.sin(t * 2 + f.x) * 3;
    ctx.strokeStyle = '#2e7d32'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(f.x, y + 14); ctx.lineTo(f.x + sway, y); ctx.stroke();
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * Math.PI * 2;
      circle(f.x + sway + Math.cos(a) * 5 * f.s, y + Math.sin(a) * 5 * f.s, 4 * f.s, f.c);
    }
    circle(f.x + sway, y, 3 * f.s, '#ff9800');
  }
  if (dark) { ctx.fillStyle = `rgba(10,10,40,${dark})`; ctx.fillRect(0, 0, W, H); }
}

function drawButterfly(t, camY) {
  const a = fade(t, 9, 22, 1);
  if (!a) return;
  const x = 200 + t * 25 + Math.sin(t * 1.7) * 60, y = GROUND - 90 + Math.sin(t * 2.3) * 30 + camY;
  const flap = Math.abs(Math.sin(t * 14));
  ctx.globalAlpha = a;
  ellipse(x - 7 * flap, y, 9 * flap + 1, 12, '#ff7ad9');
  ellipse(x + 7 * flap, y, 9 * flap + 1, 12, '#ff7ad9');
  ellipse(x, y, 2, 8, '#333');
  ctx.globalAlpha = 1;
}

function drawBirds(t) {
  const a = fade(t, 34, 47, 1);
  if (!a) return;
  ctx.globalAlpha = a; ctx.strokeStyle = '#263238'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = 0; i < 5; i++) {
    const x = W + 60 - (t - 34) * 90 + i * 45, y = 120 + i * 18 + Math.sin(t * 3 + i) * 6;
    const w = Math.sin(t * 10 + i) * 8;
    ctx.beginPath(); ctx.moveTo(x - 14, y - w); ctx.quadraticCurveTo(x - 6, y - 8, x, y);
    ctx.quadraticCurveTo(x + 6, y - 8, x + 14, y - w); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawBalloon(x, y, sx, sy) {
  ctx.strokeStyle = '#eee'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x, y + 48);
  ctx.bezierCurveTo(x + 10, y + 80, sx - 10, sy - 30, sx, sy); ctx.stroke();
  ellipse(x, y, 38, 46, '#e53935');
  ellipse(x - 12, y - 16, 8, 14, 'rgba(255,255,255,.5)', -0.4);
  ctx.fillStyle = '#c62828';
  ctx.beginPath(); ctx.moveTo(x - 6, y + 50); ctx.lineTo(x + 6, y + 50); ctx.lineTo(x, y + 44); ctx.fill();
}

// Cat drawn with feet at (x, y). pose: { walk, armUp, wave, look }
function drawCat(t, x, y, pose) {
  const fur = '#ff9f43', dark = '#e67e22';
  const step = pose.walk ? Math.sin(t * 10) : 0;
  const bob = pose.walk ? Math.abs(Math.sin(t * 10)) * 3 : 0;
  ctx.save(); ctx.translate(x, y - bob);
  // tail
  ctx.strokeStyle = fur; ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-28, -30);
  ctx.quadraticCurveTo(-60, -40 + Math.sin(t * 3) * 10, -55, -80 + Math.sin(t * 3) * 12); ctx.stroke();
  // legs
  ctx.strokeStyle = dark; ctx.lineWidth = 9;
  for (const [lx, ph] of [[-18, 1], [-6, -1], [10, -1], [22, 1]]) {
    ctx.beginPath(); ctx.moveTo(lx, -20); ctx.lineTo(lx + step * 6 * ph, 0); ctx.stroke();
  }
  // body
  ellipse(0, -32, 36, 22, fur);
  ellipse(4, -26, 18, 12, '#ffd8a8');
  // stripes
  ctx.strokeStyle = dark; ctx.lineWidth = 3;
  for (const sx of [-14, -4, 6]) { ctx.beginPath(); ctx.moveTo(sx, -53); ctx.lineTo(sx + 3, -42); ctx.stroke(); }
  // paw holding balloon / waving
  if (pose.armUp || pose.wave) {
    const ang = pose.wave ? -1.2 + Math.sin(t * 8) * 0.5 : -1.3;
    ctx.save(); ctx.translate(22, -45); ctx.rotate(ang);
    ctx.strokeStyle = fur; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(34, 0); ctx.stroke();
    circle(36, 0, 6, '#ffd8a8');
    ctx.restore();
  }
  // head
  const hx = 34 + pose.look * 4, hy = -62;
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.moveTo(hx - 22, hy - 10); ctx.lineTo(hx - 16, hy - 40); ctx.lineTo(hx - 2, hy - 20); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx + 22, hy - 10); ctx.lineTo(hx + 16, hy - 40); ctx.lineTo(hx + 2, hy - 20); ctx.fill();
  circle(hx, hy, 26, fur);
  ctx.fillStyle = '#ffb3c1';
  ctx.beginPath(); ctx.moveTo(hx - 18, hy - 16); ctx.lineTo(hx - 15, hy - 32); ctx.lineTo(hx - 8, hy - 20); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx + 18, hy - 16); ctx.lineTo(hx + 15, hy - 32); ctx.lineTo(hx + 8, hy - 20); ctx.fill();
  // eyes (blink every ~3s)
  const blink = (t % 3.2) < 0.12;
  const ey = hy - 4 - pose.look * 2;
  if (blink) {
    ctx.strokeStyle = '#222'; ctx.lineWidth = 2.5;
    for (const ex of [-9, 9]) { ctx.beginPath(); ctx.moveTo(hx + ex - 5, ey); ctx.lineTo(hx + ex + 5, ey); ctx.stroke(); }
  } else for (const ex of [-9, 9]) {
    ellipse(hx + ex, ey, 5, 7, '#222');
    circle(hx + ex + 2, ey - 3, 2, '#fff');
  }
  // nose, mouth, cheeks, whiskers
  ctx.fillStyle = '#ff6b81';
  ctx.beginPath(); ctx.moveTo(hx - 4, hy + 5); ctx.lineTo(hx + 4, hy + 5); ctx.lineTo(hx, hy + 9); ctx.fill();
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(hx - 4, hy + 10, 4, 0, Math.PI); ctx.arc(hx + 4, hy + 10, 4, 0, Math.PI); ctx.stroke();
  circle(hx - 16, hy + 8, 4, 'rgba(255,107,129,.45)'); circle(hx + 16, hy + 8, 4, 'rgba(255,107,129,.45)');
  ctx.lineWidth = 1.2;
  for (const s of [-1, 1]) for (const d of [-4, 0, 4]) {
    ctx.beginPath(); ctx.moveTo(hx + s * 10, hy + 8); ctx.lineTo(hx + s * 30, hy + 6 + d); ctx.stroke();
  }
  ctx.restore();
}

function drawText(text, y, size, alpha) {
  if (alpha <= 0) return;
  ctx.globalAlpha = alpha;
  ctx.font = `bold ${size}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = size / 6; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(text, W / 2, y);
  ctx.fillStyle = '#fff'; ctx.fillText(text, W / 2, y);
  ctx.globalAlpha = 1;
}

// ---------- the story ----------
function render(t) {
  const camY = ease(seg(t, 31, 47)) * 900;
  const moonX = 720, moonY = 170;

  drawSky(t);
  drawSun(t, camY);
  drawMoon(t, moonX, moonY);
  drawClouds(t, camY);
  drawLand(t, camY);
  drawButterfly(t, camY);
  drawBirds(t);

  // cat position
  let cx, cy, pose = { walk: false, armUp: false, wave: false, look: 0 };
  if (t < 18) {
    cx = lerp(-120, 400, seg(t, 7, 18)); cy = GROUND + 8; pose.walk = t > 7;
  } else if (t < 29) {
    cx = 400; cy = GROUND + 8; pose.look = t > 20 ? 1 : 0;
    const j = seg(t, 26.5, 29);
    cy -= Math.sin(j * Math.PI / 2) * 110;
    if (j > 0.4) pose.armUp = true;
  } else if (t < 48) {
    const up = ease(seg(t, 29, 34));
    cx = 400 + Math.sin((t - 29) * 0.8) * 60 * up + up * 60;
    cy = lerp(GROUND + 8 - 110, 330, up) + Math.sin(t * 2) * 6;
    pose.armUp = true;
  } else {
    const k = ease(seg(t, 48, 54));
    const fx = 460 + Math.sin(19 * 0.8) * 60, fy = 330 + Math.sin(96) * 6;
    cx = lerp(fx, moonX - 30, k);
    cy = lerp(fy, moonY - 82, k) - Math.sin(k * Math.PI) * 40;
    pose.armUp = t < 54; pose.wave = t >= 54;
  }

  // balloon
  if (t > 19.5) {
    let bx, by;
    if (t < 28.2) {
      const k = ease(seg(t, 19.5, 27));
      bx = lerp(1050, 460, k); by = lerp(200, 140, k) + Math.sin(t * 2) * 10;
    } else if (t < 54) {
      bx = cx + 60; by = cy - 210 + Math.sin(t * 2.5) * 4;
    } else {
      const k = seg(t, 54, 60); // released: floats away
      bx = cx + 60 + k * 200; by = cy - 210 - k * 400;
    }
    const hold = t > 28.2 && t < 54;
    const sx = hold ? cx + 58 + 10 : bx + 10, sy = hold ? cy - 84 : by + 130;
    drawBalloon(bx, by, sx, sy);
  }

  drawCat(t, cx, cy, pose);

  // titles and subtitles
  drawText('Котик и шарик', 200, 64, fade(t, 1, 7, 1));
  drawText('мультик за одну минуту', 260, 26, fade(t, 1.8, 7, 1));
  drawText('Конец', 290, 72, seg(t, 56, 57.5));
  for (const [a, b, s] of subtitles) drawText(s, H - 40, 28, fade(t, a, b, 0.4));
}

// ---------- music (WebAudio) ----------
let audio = null, soundOn = true, lastBeat = -1;
const melody = [0, 4, 7, 4, 9, 7, 4, 2, 0, 2, 4, 7, 4, 2, 0, -1];
function note(semi, len = 0.28) {
  if (!audio || !soundOn || semi < 0) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'triangle'; o.frequency.value = 523.25 * Math.pow(2, semi / 12);
  g.gain.setValueAtTime(0.0001, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.12, audio.currentTime + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + len);
  o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + len);
}
function music(t) {
  const beat = Math.floor(t / 0.32);
  if (beat === lastBeat) return;
  lastBeat = beat;
  const shift = t > 46 ? -5 : t > 29 ? 2 : 0; // mood changes with the story
  note(melody[beat % melody.length] + shift);
  if (beat % 4 === 0) note(-12 + shift + (beat % 8 ? 5 : 0), 0.5);
}

// ---------- playback ----------
let time = 0, playing = false, last = 0;
const $ = id => document.getElementById(id);
function fmt(s) { s = Math.floor(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }

function frame(now) {
  if (playing) {
    time = Math.min(DURATION, time + (now - last) / 1000);
    music(time);
    if (time >= DURATION) {
      playing = false;
      $('start').textContent = '↻ Посмотреть ещё раз';
      $('overlay').hidden = false;
    }
  }
  last = now;
  render(time);
  $('prog').style.width = (time / DURATION * 100) + '%';
  $('time').textContent = `${fmt(time)} / 1:00`;
  $('pause').textContent = playing ? '⏸' : '▶';
  requestAnimationFrame(frame);
}

$('start').onclick = () => {
  if (!audio) try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  if (time >= DURATION) { time = 0; lastBeat = -1; }
  $('overlay').hidden = true; playing = true;
};
$('pause').onclick = () => {
  if (!$('overlay').hidden) return $('start').onclick();
  playing = !playing;
};
$('sound').onclick = () => { soundOn = !soundOn; $('sound').textContent = soundOn ? '🔊' : '🔇'; };

requestAnimationFrame(frame);
</script>
</body>
</html>
